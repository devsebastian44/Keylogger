[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-keylogger"
version = "0.1.0"
description = "Educational Pentesting Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "keyboard; sys_platform == 'win32'",
    "pynput; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "bandit",
    "pip-audit"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.bandit]
exclude_dirs = ["tests"]
